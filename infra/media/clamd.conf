Foreground yes
DatabaseDirectory /var/lib/clamav
LocalSocket /ipc/clamd.sock
LocalSocketMode 660
FixStaleSocket yes
MaxThreads 1
MaxConnectionQueueLength 2
ReadTimeout 90
CommandReadTimeout 30
StreamMaxLength 160M
MaxFileSize 150M
MaxScanSize 300M
MaxScanTime 60000
MaxRecursion 16
MaxFiles 2000
AlertExceedsMax yes
LogFile /scratch/clamd.log
LogTime yes
LogVerbose no
LogClean no
LogFileMaxSize 5M
TemporaryDirectory /scratch
