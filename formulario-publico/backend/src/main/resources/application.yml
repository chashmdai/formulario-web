spring:
  application:
    name: formulario-publico
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 26MB
      file-size-threshold: 0B
server:
  max-http-request-header-size: 8KB
  tomcat:
    threads:
      max: 80
      min-spare: 8
    max-connections: 512
    accept-count: 256
    connection-timeout: 10s
    max-swallow-size: 8KB
  address: ${SIGER_BIND_ADDRESS:127.0.0.1}
  port: ${SIGER_PORT:8080}
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 20m
      tracking-modes: cookie
      cookie:
        name: SIGERSESSION
        http-only: true
        secure: ${SIGER_COOKIE_SECURE:true}
        same-site: lax
logging:
  level:
    org.springframework.security: WARN
    org.springframework.web.client: WARN
siger:
  claveunica:
    environment: ${CU_ENVIRONMENT:SANDBOX}
    client-id: ${CU_CLIENT_ID:}
    client-secret: ${CU_CLIENT_SECRET:}
    redirect-uri: ${CU_REDIRECT_URI:https://claveunica.formularioadulto.ddn.gob.cl/redirect}
    logout-uri: ${CU_LOGOUT_URI:https://claveunica.formularioadulto.ddn.gob.cl/logout}
    callback-approved: ${CU_CALLBACK_APPROVED:false}
    id-token-algorithm: ${CU_ID_TOKEN_ALGORITHM:RS256}
    public-origin: ${SIGER_PUBLIC_ORIGIN:http://localhost:5173}
publico:
  nna:
    habilitado: ${PUBLIC_NNA_ENABLED:false}
  integracion:
    http-local: ${PUBLIC_INTEGRATION_LOCAL_HTTP:false}
    token: ${PUBLIC_INTEGRATION_TOKEN:}
  entrega:
    directorio: ${PUBLIC_DEMO_DIRECTORY:}

operacion:
  token: ${PUBLIC_OPERATIONS_TOKEN:}
  http-local: ${OPERATIONS_LOCAL_HTTP:false}
